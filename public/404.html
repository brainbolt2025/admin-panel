<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/AppIcon512x.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found - Asine</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="This page does not exist on Asine." />
    <style>
      :root {
        color-scheme: light;
        --bg: #0d2b23;
        --card: #ffffff;
        --ink: #0f172a;
        --muted: #475569;
        --teal: #0f766e;
        --teal-dark: #115e59;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background:
          radial-gradient(circle at 20% 20%, rgba(82, 183, 136, 0.18), transparent 40%),
          radial-gradient(circle at 80% 0%, rgba(45, 212, 191, 0.12), transparent 35%),
          var(--bg);
        color: var(--ink);
      }
      main {
        width: min(100%, 28rem);
        background: var(--card);
        border-radius: 1.25rem;
        padding: 2rem 1.5rem;
        text-align: center;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      }
      p.kicker {
        margin: 0;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--teal);
      }
      h1 {
        margin: 0.75rem 0 0.5rem;
        font-size: 1.75rem;
        line-height: 1.2;
      }
      p.body {
        margin: 0;
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.5;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.75rem;
        margin-top: 1.5rem;
        padding: 0 1.25rem;
        border-radius: 0.75rem;
        background: var(--teal);
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover {
        background: var(--teal-dark);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">404</p>
      <h1>Page not found</h1>
      <p class="body">
        That address is not a page on Asine. Check the link, or go back to the homepage.
      </p>
      <a href="/">Back to Asine</a>
    </main>
  </body>
</html>
